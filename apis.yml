  Evangelist network as an enrichment lead. As of this enrichment pass its justincase.jp
  domain returns a 307 redirect to Sony Shoutan Insurance (sony-sasti.jp), a Sony Financial
  Group micro-insurer, indicating the business has been absorbed. No public developer
  API, documentation, SDK, developer portal, or technical integration surface was found
  on either the original or the successor domain.
